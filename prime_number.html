<body>
    <script>
        let mynum = prompt("Enter a mumber","");
        mynum = parselnt(mynum);

        function checkprime(x){
   
            if(x == 1){
                alert(x + "is not a prime number");
                return;        
            } else if(x == 2){
                    alert(x + " is a prime number");
                    return;
                }else{
                    for (let i =2; i < x; i++){
                    if(x % i == 0){
 
                         alert(x + " is  not a prime number");
                    return;
                    }

                    }
                    alert(x + "is a prime number");
                return;   
                }
        }

        checkprime(mynum); //calling
    </script>
