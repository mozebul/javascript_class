<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Question 1: Trainee Data</h2>
    <form name="myform">
      <label for="name">Name:</label>
      <input type="text" name="name"><br /><br />
      <label for="contact">Contact:</label>
      <input type="text" name="contact"><br /><br />
      <label for="remarks">Remarks:</label>
      <textarea name="remarks" ></textarea><br /><br />
      <label for="Sex">Sex:</label>
      <input type="radio" name="sex" value="male">
      <label for="male">Male</label>
      <input type="radio" name="sex" value="female">
      <label for="female">Female</label><br /><br />
      <label for="courses">Courses:</label>
      <input type="checkbox">
      <label for="NT">NT</label>
      <input type="checkbox">
      <label for="IAD">IAD</label>
      <input type="checkbox">
      <label for="DDD">DDD</label>
      <input type="checkbox">
      <label for="ESDA">ESDA</label><br /><br />
      <label for="location">Location:</label>
      <select name="location">
        <option value="">Select Location</option>
        <option>Banani</option>
        <option>Dhanmondi</option>
        <option>Gulshan</option>
        <option>Khilgaon</option></select
      ><br /><br />
      <button type="button" onclick="getValues()">Submit</button>
    </form>

    <script>
      function getValues() {
        let name = document.myform.name.value;
        let contact = document.myform.contact.value;
        let remarks = document.myform.remarks.value;
        let sex = document.myform.sex.value;
        let location = document.myform.location.value;
      
        let output = "";
        output += "Name: " + name + "<br>";
        output += "Contact: " + contact + "<br>";
        output += "Remarks: " + remarks + "<br>";
        output += "Sex: " + sex + "<br>";
        output += "Location: " + location + "<br>";

        let mywin = window.open("", "", "height:300, width:300");
        mywin.document.write(output);
      }
    </script>
  </body>
</html>
